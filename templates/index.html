<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Bengaluru House Price Predictor</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="static\css\style.css">
    
    <style>
        /* body {
            background-color: #212529;
        } */

        .main-card {
            margin-top: 50px;
            margin-bottom: 50px;
            border-radius: 12px;
        }

        .card-header {
            text-align: center;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: bold;
        }

        #prediction {
            font-weight: bold;
            color: #198754;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <div class="card main-card">

                    <!-- Card Header -->
                    <div class="card-header">
                        <h1>🏘️Welcome to Bengaluru House Price Predictor📈</h1>
                    </div>

                    <!-- Card Body -->
                    <div class="card-body">

                        <h5 class="mb-4">
                            Want to predict the price of a new house in Bengaluru?
                            Fill in the details below:
                        </h5>

                        <!-- Prediction Form -->
                        <form
                            id="predictionForm"
                            action="/predict"
                            method="POST"
                            accept-charset="utf-8"
                        >

                            <div class="row">

                                <!-- Location -->
                                <div class="col-md-6 form-group">
                                    <label for="location" class="form-label">
                                        Select Location
                                    </label>

                                    <select
                                        class="form-select"
                                        id="location"
                                        name="location"
                                        required
                                    >
                                        <option value="" disabled selected>
                                            Select Location
                                        </option>

                                        {% for location in locations %}
                                            <option value="{{ location }}">
                                                {{ location }}
                                            </option>
                                        {% endfor %}

                                    </select>
                                </div>

                                <!-- BHK -->
                                <div class="col-md-6 form-group">
                                    <label for="bhk" class="form-label">
                                        Enter BHK
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="bhk"
                                        name="bhk"
                                        placeholder="Enter BHK"
                                        min="1"
                                        step="1"
                                        required
                                    >
                                </div>

                                <!-- Bathrooms -->
                                <div class="col-md-6 form-group">
                                    <label for="bath" class="form-label">
                                        Enter Number of Bathrooms
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="bath"
                                        name="bath"
                                        placeholder="Enter Bathrooms"
                                        min="1"
                                        step="any"
                                        required
                                    >
                                </div>

                                <!-- Square Feet -->
                                <div class="col-md-6 form-group">
                                    <label for="total_sqft" class="form-label">
                                        Enter Square Feet
                                    </label>

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="total_sqft"
                                        name="total_sqft"
                                        placeholder="Enter Square Feet"
                                        min="1"
                                        step="any"
                                        required
                                    >
                                </div>

                                <!-- Submit Button -->
                                <div class="col-12 form-group">
                                    <button
                                        type="submit"
                                        id="predict"
                                        class="btn btn-primary form-control"
                                    >
                                        Predict Price
                                    </button>
                                </div>

                            </div>

                        </form>

                        <!-- Prediction Result -->
                        <div class="text-center mt-4">
                            <h4>
                                <span id="prediction"></span>
                            </h4>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- AJAX JavaScript -->
    <script>

        const form = document.getElementById("predictionForm");
        const predictionResult = document.getElementById("prediction");
        const predictButton = document.getElementById("predict");

        form.addEventListener("submit", function(event) {

            // Prevent normal form submission
            event.preventDefault();

            // Collect form data
            const formData = new FormData(form);

            // Create AJAX request
            const xhr = new XMLHttpRequest();

            xhr.open("POST", "/predict", true);

            // Show loading message
            predictionResult.textContent =
                "Please wait... Predicting Price!";

            predictButton.disabled = true;

            xhr.onreadystatechange = function() {

                if (xhr.readyState === XMLHttpRequest.DONE) {

                    predictButton.disabled = false;

                    if (xhr.status === 200) {

                        predictionResult.textContent =
                            "Predicted House Price: ₹" + xhr.responseText;

                    } else {

                        predictionResult.textContent =
                            "Error: " + xhr.responseText;

                    }
                }
            };

            // Handle connection errors
            xhr.onerror = function() {

                predictButton.disabled = false;

                predictionResult.textContent =
                    "Unable to connect to the server.";

            };

            // Send form data to Flask
            xhr.send(formData);

        });

    </script>

    <!-- Bootstrap JavaScript Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
